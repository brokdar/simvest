name: E2E

on:
  pull_request:
    branches:
      - main

jobs:
  e2e:
    name: Playwright / ${{ matrix.project }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simvest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: mobile-safari
            browser: webkit

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('simvest/bun.lock') }}

      - name: Install Playwright browser
        run: bun run playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        run: bun run test:e2e -- --project=${{ matrix.project }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            simvest/playwright-report/
            simvest/test-results/
          retention-days: 7
